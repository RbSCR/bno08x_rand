name: ROS2 Linter

on:
  pull_request:
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  MY_PACKAGES: bno08x_rand

jobs:
  # Note that we pass each job a different name to distinguish each linter job
  ament_lint:
    name: ${{ matrix.distribution }}-ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linter: [xmllint, pep257, lint_cmake, cpplint]
        distribution: [jazzy, kilted]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ros-tooling/setup-ros@0.7.19
      - uses: ros-tooling/action-ros-lint@0.1.4
        with:
          distribution: ${{ matrix.distribution }}
          linter: ${{ matrix.linter }}
          package-name: $MY_PACKAGES
