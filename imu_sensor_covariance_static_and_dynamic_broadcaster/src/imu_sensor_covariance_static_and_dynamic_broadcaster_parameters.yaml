imu_sensor_covariance_static_and_dynamic_broadcaster:
  sensor_name: {
    type: string,
    default_value: "",
    description: "Defines sensor name used as prefix for its interfaces.
    Interface names are: ``<sensor_name>/orientation.x, ..., <sensor_name>/angular_velocity.x, ...,
    <sensor_name>/linear_acceleration.x.``",
    validation: {
      not_empty<>: null
    }
  }
  frame_id: {
    type: string,
    default_value: "",
    description: "Sensor's frame_id in which values are published.",
    validation: {
      not_empty<>: null
    }
  }
  static_covariance_orientation: {
    type: double_array,
    # Medium accuracy covariance
    default_value: [1.5e-3, 0.0,    0.0,
                    0.0,    1.5e-3, 0.0,
                    0.0,    0.0,    1.5e-3],
    read_only: true,
    description: "Static orientation covariance. Row major about x, y, z axes",
    validation: {
      fixed_size<>: [9],
    }
  }
  static_covariance_angular_velocity: {
    type: double_array,
    # Medium accuracy covariance
    default_value: [2.5e-3, 0.0,    0.0,
                    0.0,    2.5e-3, 0.0,
                    0.0,    0.0,    2.5e-3],
    read_only: true,
    description: "Static angular velocity covariance. Row major about x, y, z axes",
    validation: {
      fixed_size<>: [9],
    }
  }
  static_covariance_linear_acceleration: {
    type: double_array,
    # Medium accuracy covariance
    default_value: [0.2, 0.0, 0.0,
                    0.0, 0.2, 0.0,
                    0.0, 0.0, 0.2],
    read_only: true,
    description: "Static linear acceleration covariance. Row major about x, y, z axes",
    validation: {
      fixed_size<>: [9],
    }
  }
  read_covariance_from_interface: {
    type: bool,
    default_value: True,
    description: "Read covariance from state interface, otherwise static covariance will be used",
  }
  rotation_offset:
    roll: {
      type: double,
      default_value: 0.0,
      read_only: true,
      description: "Roll offset value in radians. (Z-Y'-X'' convention)",
    }
    pitch: {
      type: double,
      default_value: 0.0,
      read_only: true,
      description: "Pitch offset value in radians. (Z-Y'-X'' convention)",
    }
    yaw: {
      type: double,
      default_value: 0.0,
      read_only: true,
      description: "Yaw offset value in radians. (Z-Y'-X'' convention)",
    }
