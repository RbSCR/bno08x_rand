imu_sensor_covariance_broadcaster:
  sensor_name: {
    type: string,
    default_value: "",
    read_only: true,
    description: "Defines sensor name used as prefix for its interfaces.
    Interface names are: ``<sensor_name>/orientation.x, ..., <sensor_name>/angular_velocity.x, ...,
    <sensor_name>/linear_acceleration.x.``",
    validation: {
      not_empty<>: null
    }
  }
  frame_id: {
    type: string,
    default_value: "",
    read_only: true,
    description: "Sensor's frame_id in which values are published.",
    validation: {
      not_empty<>: null
    }
  }
  rotation_offset:
    roll: {
      type: double,
      default_value: 0.0,
      read_only: true,
      description: "Roll offset value in radians. (Z-Y'-X'' convention)",
    }
    pitch: {
      type: double,
      default_value: 0.0,
      read_only: true,
      description: "Pitch offset value in radians. (Z-Y'-X'' convention)",
    }
    yaw: {
      type: double,
      default_value: 0.0,
      read_only: true,
      description: "Yaw offset value in radians. (Z-Y'-X'' convention)",
    }
