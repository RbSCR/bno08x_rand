bno08x_try_sensor_status:
  ros__parameters:

    frame_id: "imu_frame"  # The frame_id to use for the sensor data

    # Communication Interface
    # Select the communication interface to use
    # (only one interface can be enabled at a time)
    # This requires a hardware change to the board
    # (see documentation for more information)
    i2c:
      enabled: true
      bus: "/dev/i2c-1"
      address: "0x4A"

    publish:
      magnetic_field:
        enabled: true
        rate: 100   # max 100 Hz
      imu:
        enabled: true
        rate: 100   # max 400 Hz
