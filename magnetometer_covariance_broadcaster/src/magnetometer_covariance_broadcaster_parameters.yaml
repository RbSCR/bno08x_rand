magnetometer_covariance_broadcaster:
  sensor_name: {
    type: string,
    default_value: "",
    read_only: true,
    description: "Defines sensor name used as prefix for its interfaces.
    Interface names are: ``<sensor_name>/magnetic_field.x, <sensor_name>/magnetic_field.x, <sensor_name>/magnetic_field, <sensor_name>/magnetic_field_covariance.``",
    validation: {
      not_empty<>: null
    }
  }
  frame_id: {
    type: string,
    default_value: "",
    read_only: true,
    description: "Sensor's frame_id in which values are published.",
    validation: {
      not_empty<>: null
    }
  }

